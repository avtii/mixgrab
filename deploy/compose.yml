# mixgrab on the Tonk VM. Lives in /opt/mixgrab; the deploy workflow writes this file and .env there.
# Caddy (burrball stack) proxies mixgrab.roketz.app -> mixgrab:8080 over the burrball_default network.
services:
  mixgrab:
    image: ghcr.io/avtii/mixgrab:latest
    container_name: mixgrab
    restart: unless-stopped
    env_file: .env
    environment:
      MIXGRAB_DATA: /data
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      POT_URL: http://mixgrab-pot:4416   # YouTube PO tokens (needed alongside cookies by some clients)
      BROWSER_PROFILE: /browser/Default  # the sign-in browser's Chromium profile, for its YouTube cookies
      SLSK_PORT: "61234"                 # set here, not in .env: it must match the ports published below
    volumes:
      - ./data:/data
      - ./browser/.config/chromium:/browser:ro
    # Soulseek peers must reach these from the internet, so they stay on all interfaces.
    # Changing the port means changing SLSK_PORT above and both lines here (obfuscated = SLSK_PORT + 1).
    ports:
      - "61234:61234"        # Soulseek peers connect here (plain)
      - "61235:61235"        # Soulseek obfuscated port
    networks: [burrball_default]
    mem_limit: 1500m
    # runs as uid 1000 and binds only ports above 1024: it needs no Linux capabilities at all
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [mixgrab-pot]

  # Mints YouTube proof-of-origin tokens for yt-dlp (bgutil-ytdlp-pot-provider). Internal only, no ports.
  mixgrab-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: mixgrab-pot
    restart: unless-stopped
    init: true
    networks: [burrball_default]
    mem_limit: 512m

  # The YouTube sign-in browser: Chromium streamed to the web page at /yt-login/. Internal only, no ports;
  # Caddy sends /yt-login/* here only after mixgrab's /api/authcheck accepts the owner session.
  mixgrab-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: mixgrab-browser
    restart: unless-stopped
    environment:
      PUID: "1000"                       # same uid as mixgrab, so it can read the profile
      PGID: "1000"
      TZ: Etc/UTC
      SUBFOLDER: /yt-login/
      TITLE: mixgrab - YouTube sign-in
      # basic password store: cookies stay readable by mixgrab (no desktop keyring in the container)
      CHROME_CLI: --password-store=basic https://accounts.google.com/ServiceLogin?service=youtube&continue=https%3A%2F%2Fwww.youtube.com%2F
    volumes:
      - ./browser:/config
    shm_size: 1gb
    security_opt: [seccomp:unconfined]
    networks: [burrball_default]
    mem_limit: 1500m

networks:
  burrball_default:
    external: true
