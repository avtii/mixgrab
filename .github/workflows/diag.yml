name: Diagnose YouTube on the server

on:
  workflow_dispatch:
    inputs:
      video:
        description: YouTube video ID to test
        default: t6oJzp6SwNo

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          VIDEO: ${{ inputs.video }}
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          envs: VIDEO
          command_timeout: 10m
          script: |
            docker ps --filter name=mixgrab --format '{{.Names}} {{.Status}}'
            # Can mixgrab read the sign-in browser's cookies? (counts only, never values)
            docker exec mixgrab python -c "
            import http.cookiejar as hc
            from yt_dlp.cookies import extract_cookies_from_browser as x
            from mixgrab.tracklist import _QuietLog
            try:
                jar = x('chromium', '/browser/Default', _QuietLog(), keyring='BASICTEXT')
                g = [c for c in jar if c.domain.lstrip('.').endswith(('google.com', 'youtube.com'))]
                print('sign-in browser: readable,', len(list(jar)), 'cookies,', len(g), 'google/youtube,',
                      'signed in' if any(c.name in ('SAPISID', 'LOGIN_INFO') for c in g) else 'not signed in')
            except Exception as e:
                print('sign-in browser: NOT readable:', str(e)[:200])
            "
            # Does YouTube let the server through with the current cookies?
            out=$(docker exec mixgrab sh -c 'yt-dlp --simulate --no-cache-dir --print title \
              --extractor-args "youtubepot-bgutilhttp:base_url=http://mixgrab-pot:4416" \
              $( [ -f /data/youtube-cookies.txt ] && echo --cookies /data/youtube-cookies.txt ) \
              "https://www.youtube.com/watch?v='"$VIDEO"'"' 2>&1 | tail -2)
            case "$out" in *ERROR*) echo "youtube: FAIL $(echo "$out" | grep ERROR | cut -c1-120)";; *) echo "youtube: OK $out";; esac
