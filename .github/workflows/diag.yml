name: Diagnose YouTube on the server

on:
  workflow_dispatch:
    inputs:
      video:
        description: YouTube video ID to test
        default: t6oJzp6SwNo

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          VIDEO: ${{ inputs.video }}
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          envs: VIDEO
          command_timeout: 10m
          script: |
            U="https://www.youtube.com/watch?v=$VIDEO"
            POT="youtubepot-bgutilhttp:base_url=http://mixgrab-pot:4416"
            try() {  # $1 = label, rest = extra yt-dlp args; prints OK + title or the error
              out=$(docker exec mixgrab yt-dlp --simulate --no-cache-dir --print title --extractor-args "$POT" "${@:2}" "$U" 2>&1 | tail -2)
              case "$out" in *ERROR*) echo "$1: FAIL $(echo "$out" | grep ERROR | cut -c1-120)";; *) echo "$1: OK $out";; esac
            }
            try "plain"
            echo "host IPv6 routes: $(ip -6 route show default | head -1)"
            # IPv6 straight from the host network (the compose network has no IPv6)
            POTIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mixgrab-pot)
            out=$(docker run --rm --network host --entrypoint yt-dlp ghcr.io/avtii/mixgrab:latest -6 --simulate --no-cache-dir \
              --print title --extractor-args "youtubepot-bgutilhttp:base_url=http://$POTIP:4416" "$U" 2>&1 | tail -2)
            case "$out" in *ERROR*) echo "host-ipv6: FAIL $(echo "$out" | grep ERROR | cut -c1-120)";; *) echo "host-ipv6: OK $out";; esac
