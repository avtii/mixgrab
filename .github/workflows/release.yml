name: Console executables

# Builds stand-alone mixgrab executables for Windows and macOS.
# Push a tag like v0.3.0 to publish them as a GitHub Release; run manually to just get build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: mixgrab-windows-x64.zip
          - os: macos-latest
            asset: mixgrab-macos-arm64.tar.gz
          - os: macos-15-intel
            asset: mixgrab-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install . "yt-dlp[default]" pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build mixgrab.spec
      - name: Smoke test
        shell: bash
        run: |
          ./dist/mixgrab --version
          ./dist/mixgrab --check || true
          ./dist/mixgrab --help > /dev/null
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/mixgrab.exe -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/mixgrab
          tar -czf ${{ matrix.asset }} -C dist mixgrab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          generate_release_notes: true
