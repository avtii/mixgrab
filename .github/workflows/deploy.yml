name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[web]"
      - run: python -m compileall -q mixgrab
      - name: Import smoke test
        run: python -c "import mixgrab.cli, mixgrab.engine, mixgrab.lookup, mixgrab.youtube, mixgrab.web.app"

  docker:
    # Publishes ghcr.io/<owner>/mixgrab:latest
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          # public repo: don't publish the build record (it embeds the push event, incl. the pusher's email)
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Runs when DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY and MIXGRAB_PASSWORD are set as repository secrets.
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      HAS_KEY: ${{ secrets.DEPLOY_KEY && 'yes' || '' }}
      HAS_PW: ${{ secrets.MIXGRAB_PASSWORD && 'yes' || '' }}
    steps:
      - name: Report what is configured
        run: |
          echo "DEPLOY_HOST set: ${{ env.DEPLOY_HOST != '' }}"
          echo "DEPLOY_KEY set: ${{ env.HAS_KEY != '' }}"
          echo "MIXGRAB_PASSWORD set: ${{ env.HAS_PW != '' }}"
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != '' && env.HAS_KEY != '' && env.HAS_PW != ''
      - name: Copy compose file
        if: env.DEPLOY_HOST != '' && env.HAS_KEY != '' && env.HAS_PW != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          source: deploy/compose.yml
          target: /opt/mixgrab
          strip_components: 1
      - name: Configure, pull and restart on the server
        if: env.DEPLOY_HOST != '' && env.HAS_KEY != '' && env.HAS_PW != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIXGRAB_PASSWORD: ${{ secrets.MIXGRAB_PASSWORD }}
          MIXGRAB_USER: ${{ vars.MIXGRAB_USER || 'owner' }}
          AUDD_TOKEN: ${{ secrets.AUDD_TOKEN }}
          ACR_HOST: ${{ vars.ACR_HOST }}
          ACR_ACCESS_KEY: ${{ secrets.ACR_ACCESS_KEY }}
          ACR_ACCESS_SECRET: ${{ secrets.ACR_ACCESS_SECRET }}
          DOMAIN: ${{ vars.MIXGRAB_DOMAIN || 'mixgrab.roketz.app' }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          envs: GHCR_USER,GHCR_TOKEN,MIXGRAB_PASSWORD,MIXGRAB_USER,AUDD_TOKEN,ACR_HOST,ACR_ACCESS_KEY,ACR_ACCESS_SECRET,DOMAIN
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/mixgrab
            mkdir -p data && chown 1000:1000 data
            umask 077
            {
              printf "MIXGRAB_USER='%s'\n" "$MIXGRAB_USER"
              printf "MIXGRAB_PASSWORD='%s'\n" "$MIXGRAB_PASSWORD"
              [ -n "$AUDD_TOKEN" ] && printf "AUDD_TOKEN='%s'\n" "$AUDD_TOKEN"
              [ -n "$ACR_HOST" ] && printf "ACR_HOST='%s'\nACR_ACCESS_KEY='%s'\nACR_ACCESS_SECRET='%s'\n" "$ACR_HOST" "$ACR_ACCESS_KEY" "$ACR_ACCESS_SECRET"
              [ -f extra.env ] && cat extra.env
              true
            } > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            # Caddy (burrball stack): add the site once, then reload
            CF=/root/burrball/Caddyfile
            if [ -f "$CF" ] && ! grep -q "^$DOMAIN" "$CF"; then
              printf '\n%s {\n\treverse_proxy mixgrab:8080\n\tencode gzip\n}\n' "$DOMAIN" >> "$CF"
              docker exec burrball-caddy-1 caddy reload --config /etc/caddy/Caddyfile
              echo "Caddy: added $DOMAIN"
            fi
            docker image prune -f
            sleep 5
            docker compose ps
            docker exec mixgrab python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8080/healthz').read())"
      - name: Skipped
        if: env.DEPLOY_HOST == '' || env.HAS_KEY == '' || env.HAS_PW == ''
        run: echo "DEPLOY_HOST, DEPLOY_KEY or MIXGRAB_PASSWORD is missing, so the image was published but not deployed."
